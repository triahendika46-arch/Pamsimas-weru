name: Build Pamsimas Debug APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
      - name: Siapin file .env
        run: cp .env.example .env || echo "no env example"
      - name: Build APK
        run: gradle assembleDebug --stacktrace
      - name: Simpan APK-nya
        uses: actions/upload-artifact@v4
        with:
          name: Pamsimas-APK
          path: app/build/outputs/apk/debug/app-debug.apk
